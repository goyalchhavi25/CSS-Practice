<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="STYLER.CSS">
</head>
<body>
    <div class="box">
       <form >
         <h1>Login</h1>
         <div>
          <label for="first" style="display:block">Username</label>
          <input type="text" id="first" placeholder="Enter your username">
           </div>
           <div>
          <label for="second" style="display:block">Password</label>
          <input type="text" id="second" placeholder="Enter your password">
          </div>
          <BUTTON style="width:100%;padding:5px; height:40px;font-size:20px; font-weight:600;background-color:rgb(138,138,242);color:white;">Login</BUTTON>
       </form>
    </div>
</body>
</html>
